[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spectra"
version = "2.0.0"
description = "Universal High-Throughput Model Compression and Inference Engine with In-Register Triton Fused Kernels"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "NeuraCryption Non-Commercial Research & Evaluation License" }
authors = [
    { name = "NeuraCryption Private Limited", email = "contact@neuracryption.com" }
]
keywords = [
    "deep-learning",
    "llm",
    "quantization",
    "triton",
    "inference-engine",
    "model-compression",
    "hdsq",
    "neuracryption"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.2.0",
    "triton>=2.1.0; platform_system == 'Linux'",
    "transformers>=4.40.0",
    "accelerate>=0.28.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "psutil>=5.9.0",
    "pydantic>=2.0.0",
    "safetensors>=0.4.0",
    "numpy>=1.24.0"
]

[project.scripts]
spectra = "spectra.cli:main"

[tool.setuptools]
packages = ["spectra"]

[tool.setuptools.package-data]
spectra = ["web/*", "web/**/*"]
